{% extends 'base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="auth-card split">
    <div class="auth-visual register-visual">
      <h2>Create your traveler account</h2>
      <p>Join TourMate Nepal to book packages and get personalized suggestions.</p>
    </div>
    <div class="auth-form">
      <h1>Register</h1>
      <form method="POST">
        <div class="form-group"><label>Full Name</label><input type="text" name="name" required></div>
        <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
        <div class="form-group"><label>Phone</label><input type="text" name="phone"></div>
        <div class="form-group"><label>Password</label><input type="password" name="password" required minlength="6"></div>
        <button class="btn btn-dark full" type="submit">Create Account</button>
      </form>
      <p class="muted-line">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
  </div>
</section>
{% endblock %}
